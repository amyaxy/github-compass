name: probe

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: run probe
        run: pnpm probe

      - name: commit data
        run: |
          git config user.name "github-compass-bot"
          git config user.email "github-compass-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
          else
            git commit -m "data: probe update $(TZ='Asia/Shanghai' date +%Y-%m-%dT%H:%M:%S+08:00)"
            git push
          fi
