name: release

# 发布安装包：推 v* tag 自动构建 win/mac 安装包并发布到 Releases；
# workflow_dispatch 仅构建为 artifact（调试用，不发 Release）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            builder: --win
          - os: macos-latest
            builder: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm client:build
      - name: electron-builder (${{ matrix.os }})
        run: pnpm -C packages/client exec electron-builder ${{ matrix.builder }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # 未签名：mac 首次打开需右键→打开（USAGE 手册已说明）
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/client/release/*.exe
            packages/client/release/*.dmg
            packages/client/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
            *.zip
          generate_release_notes: true
